<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bg)" rx="16"/>
  <rect width="798" height="418" x="1" y="1" fill="none" stroke="#334155" stroke-width="1.5" rx="15"/>

  <!-- Title -->
  <text x="36" y="44" fill="#f8fafc" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif">MARKET STRUCTURE: BOS vs CHoCH</text>
  <rect x="36" y="56" width="220" height="22" rx="4" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
  <text x="46" y="71" fill="#c084fc" font-size="11" font-weight="600" font-family="system-ui, sans-serif">TREND CONTINUATION &amp; REVERSAL</text>

  <!-- Uptrend Swings -->
  <!-- Low 1 -> High 1 -> Low 2 -> High 2 -->
  <polyline points="80,320 180,180 250,260 380,110 460,200 560,80 640,290 730,220" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Swing Points Labels -->
  <circle cx="80" cy="320" r="5" fill="#10b981"/>
  <text x="65" y="345" fill="#94a3b8" font-size="11" font-weight="700" font-family="system-ui">HL 1</text>

  <circle cx="180" cy="180" r="5" fill="#10b981"/>
  <text x="170" y="165" fill="#94a3b8" font-size="11" font-weight="700" font-family="system-ui">HH 1</text>

  <circle cx="250" cy="260" r="5" fill="#10b981"/>
  <text x="240" y="285" fill="#94a3b8" font-size="11" font-weight="700" font-family="system-ui">HL 2</text>

  <!-- BOS 1 line -->
  <line x1="180" y1="180" x2="390" y2="180" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="260" y="165" width="105" height="22" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <text x="268" y="180" fill="#34d399" font-size="10" font-weight="700" font-family="system-ui">BOS (Continuation)</text>

  <circle cx="380" cy="110" r="5" fill="#10b981"/>
  <text x="370" y="95" fill="#94a3b8" font-size="11" font-weight="700" font-family="system-ui">HH 2</text>

  <circle cx="460" cy="200" r="6" fill="#f59e0b"/>
  <text x="420" y="225" fill="#fbbf24" font-size="11" font-weight="800" font-family="system-ui">KEY HL 3 (Structural Floor)</text>

  <!-- BOS 2 line -->
  <line x1="380" y1="110" x2="570" y2="110" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="460" y="95" width="105" height="22" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <text x="468" y="110" fill="#34d399" font-size="10" font-weight="700" font-family="system-ui">BOS (Break of High)</text>

  <circle cx="560" cy="80" r="6" fill="#f43f5e"/>
  <text x="550" y="65" fill="#fda4af" font-size="12" font-weight="800" font-family="system-ui">FINAL HIGH</text>

  <!-- CHoCH Break line below HL 3 -->
  <line x1="460" y1="200" x2="680" y2="200" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="5,5"/>
  <rect x="580" y="175" width="180" height="26" rx="4" fill="#f43f5e" fill-opacity="0.25" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="588" y="192" fill="#fca5a5" font-size="11" font-weight="800" font-family="system-ui">⚡ CHoCH (Trend Invalidation)</text>

  <circle cx="640" cy="290" r="6" fill="#f43f5e"/>
  <text x="630" y="315" fill="#f43f5e" font-size="11" font-weight="700" font-family="system-ui">LOWER LOW (LL)</text>

  <!-- Retest & Short Entry -->
  <circle cx="730" cy="220" r="6" fill="#ef4444"/>
  <rect x="670" y="235" width="120" height="24" rx="4" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
  <text x="678" y="251" fill="#fca5a5" font-size="11" font-weight="700" font-family="system-ui">🎯 SHORT RETEST</text>
</svg>

