<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg)" rx="16"/>
  <rect width="798" height="418" x="1" y="1" fill="none" stroke="#334155" stroke-width="1.5" rx="15"/>

  <!-- Title & Badge -->
  <text x="36" y="44" fill="#f8fafc" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif">LIQUIDITY SWEEP &amp; STOP HUNT (SFP / TURTLE SOUP)</text>
  <rect x="36" y="56" width="180" height="22" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
  <text x="46" y="71" fill="#60a5fa" font-size="11" font-weight="600" font-family="system-ui, sans-serif">SMART MONEY REVERSAL</text>

  <!-- Resistance / Liquidity Pool Level -->
  <line x1="120" y1="130" x2="730" y2="130" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,6"/>
  <rect x="540" y="106" width="190" height="22" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="548" y="121" fill="#fbbf24" font-size="11" font-weight="600" font-family="system-ui, sans-serif">⚠️ BUY-SIDE LIQUIDITY (EQUAL HIGHS)</text>

  <!-- Candles -->
  <!-- Candle 1: Bullish push up -->
  <line x1="200" y1="210" x2="200" y2="290" stroke="#10b981" stroke-width="2"/>
  <rect x="188" y="230" width="24" height="50" fill="url(#bull)" rx="2"/>

  <!-- Candle 2: Creates the swing high at 130 -->
  <line x1="270" y1="130" x2="270" y2="240" stroke="#10b981" stroke-width="2"/>
  <rect x="258" y="160" width="24" height="60" fill="url(#bull)" rx="2"/>
  <text x="250" y="120" fill="#94a3b8" font-size="11" font-weight="600" font-family="system-ui">Swing High 1</text>

  <!-- Candle 3: Pullback -->
  <line x1="340" y1="180" x2="340" y2="270" stroke="#f43f5e" stroke-width="2"/>
  <rect x="328" y="190" width="24" height="60" fill="url(#bear)" rx="2"/>

  <!-- Candle 4: Re-accumulation -->
  <line x1="410" y1="200" x2="410" y2="280" stroke="#10b981" stroke-width="2"/>
  <rect x="398" y="220" width="24" height="50" fill="url(#bull)" rx="2"/>

  <!-- Candle 5: THE SWEEP CANDLE - Massive upper wick piercing liquidity level -->
  <line x1="480" y1="90" x2="480" y2="250" stroke="#f43f5e" stroke-width="3"/>
  <rect x="468" y="150" width="24" height="80" fill="url(#bear)" rx="2"/>

  <!-- Sweep annotation -->
  <circle cx="480" cy="90" r="6" fill="#f43f5e"/>
  <path d="M 495 85 L 535 70" stroke="#f43f5e" stroke-width="2"/>
  <rect x="540" y="58" width="210" height="26" rx="4" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="548" y="75" fill="#fda4af" font-size="11" font-weight="700" font-family="system-ui">SWEEP WICK: Traps breakout buyers</text>

  <!-- Candle 6: Massive Bearish Confirmation displacement -->
  <line x1="550" y1="190" x2="550" y2="350" stroke="#f43f5e" stroke-width="2"/>
  <rect x="538" y="210" width="24" height="120" fill="url(#bear)" rx="2"/>

  <!-- Entry & SL Callout -->
  <line x1="570" y1="220" x2="680" y2="220" stroke="#3b82f6" stroke-width="2"/>
  <rect x="590" y="206" width="120" height="24" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
  <text x="598" y="222" fill="#93c5fd" font-size="11" font-weight="700" font-family="system-ui">🎯 SHORT ENTRY</text>

  <line x1="570" y1="88" x2="680" y2="88" stroke="#ef4444" stroke-width="2"/>
  <rect x="610" y="76" width="100" height="24" rx="4" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
  <text x="618" y="92" fill="#fca5a5" font-size="11" font-weight="700" font-family="system-ui">🛑 STOP LOSS</text>

  <!-- Target -->
  <line x1="50" y1="360" x2="750" y2="360" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="600" y="348" width="150" height="24" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <text x="608" y="364" fill="#6ee7b7" font-size="11" font-weight="700" font-family="system-ui">🏆 TAKE PROFIT (1:3 R:R)</text>
</svg>

