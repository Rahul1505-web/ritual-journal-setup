<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bg)" rx="16"/>
  <rect width="798" height="418" x="1" y="1" fill="none" stroke="#334155" stroke-width="1.5" rx="15"/>

  <!-- Title -->
  <text x="36" y="44" fill="#f8fafc" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif">FAIR VALUE GAP (BULLISH FVG / IMBALANCE)</text>
  <rect x="36" y="56" width="180" height="22" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="46" y="71" fill="#34d399" font-size="11" font-weight="600" font-family="system-ui, sans-serif">3-CANDLE DISPLACEMENT</text>

  <!-- Candle 1: Setup Candle -->
  <line x1="200" y1="230" x2="200" y2="330" stroke="#10b981" stroke-width="2"/>
  <rect x="186" y="250" width="28" height="60" fill="url(#bull)" rx="2"/>
  <text x="180" y="360" fill="#94a3b8" font-size="12" font-weight="700" font-family="system-ui">Candle #1</text>
  <!-- Wick high of Candle 1 -->
  <line x1="170" y1="230" x2="520" y2="230" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="50" y="234" fill="#fbbf24" font-size="11" font-weight="600" font-family="system-ui">Candle 1 High ──▶</text>

  <!-- Candle 2: Explosive Expansion / Displacement -->
  <line x1="290" y1="90" x2="290" y2="290" stroke="#10b981" stroke-width="3"/>
  <rect x="274" y="110" width="32" height="150" fill="url(#bull)" rx="2"/>
  <text x="268" y="360" fill="#34d399" font-size="12" font-weight="700" font-family="system-ui">Candle #2 (Expansion)</text>

  <!-- Candle 3: Third Candle -->
  <line x1="380" y1="130" x2="380" y2="240" stroke="#10b981" stroke-width="2"/>
  <rect x="366" y="150" width="28" height="60" fill="url(#bull)" rx="2"/>
  <text x="360" y="360" fill="#94a3b8" font-size="12" font-weight="700" font-family="system-ui">Candle #3</text>
  <!-- Wick low of Candle 3 -->
  <line x1="350" y1="170" x2="520" y2="170" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="530" y="174" fill="#fbbf24" font-size="11" font-weight="600" font-family="system-ui">◀── Candle 3 Low</text>

  <!-- FVG Imbalance Box -->
  <rect x="200" y="170" width="320" height="60" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="2" rx="4"/>
  <text x="260" y="205" fill="#93c5fd" font-size="13" font-weight="700" font-family="system-ui">FAIR VALUE GAP (FVG)</text>
  <text x="245" y="222" fill="#bfdbfe" font-size="11" font-family="system-ui">Unfilled Institutional Liquidity Zone</text>

  <!-- Candle 4: Retest / Mitigation Candle into FVG -->
  <line x1="480" y1="140" x2="480" y2="210" stroke="#3b82f6" stroke-width="2.5"/>
  <rect x="466" y="150" width="28" height="40" fill="#3b82f6" rx="2"/>
  <circle cx="480" cy="205" r="5" fill="#10b981"/>
  <text x="440" y="125" fill="#60a5fa" font-size="11" font-weight="700" font-family="system-ui">⚡ TAP &amp; RETEST</text>

  <!-- Long Entry Callout -->
  <line x1="495" y1="200" x2="650" y2="200" stroke="#10b981" stroke-width="2"/>
  <rect x="540" y="186" width="160" height="26" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.2"/>
  <text x="548" y="203" fill="#6ee7b7" font-size="11" font-weight="700" font-family="system-ui">🟢 OPTIMAL LONG ENTRY</text>

  <!-- SL Placement -->
  <line x1="180" y1="310" x2="680" y2="310" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="550" y="300" width="150" height="22" rx="4" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1"/>
  <text x="558" y="315" fill="#fca5a5" font-size="11" font-weight="600" font-family="system-ui">🛑 SL BELOW CANDLE 1</text>
</svg>

