<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bg)" rx="16"/>
  <rect width="798" height="418" x="1" y="1" fill="none" stroke="#334155" stroke-width="1.5" rx="15"/>

  <!-- Title -->
  <text x="36" y="44" fill="#f8fafc" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif">INSTITUTIONAL 1:3 RISK-TO-REWARD (R:R) BLUEPRINT</text>
  <rect x="36" y="56" width="230" height="22" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="46" y="71" fill="#34d399" font-size="11" font-weight="600" font-family="system-ui, sans-serif">ASYMMETRIC RISK MATHEMATICS</text>

  <!-- Green Target Area (Profit Zone: 3R) -->
  <rect x="180" y="90" width="440" height="150" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2" rx="6"/>
  <!-- Red Risk Area (Stop Zone: 1R) -->
  <rect x="180" y="240" width="440" height="60" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="2" rx="6"/>

  <!-- Entry Line -->
  <line x1="120" y1="240" x2="720" y2="240" stroke="#3b82f6" stroke-width="3"/>
  <rect x="50" y="226" width="120" height="28" rx="4" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="58" y="244" fill="#93c5fd" font-size="12" font-weight="800" font-family="system-ui">ENTRY LEVEL</text>

  <!-- Stop Loss Line -->
  <line x1="120" y1="300" x2="720" y2="300" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6,6"/>
  <rect x="50" y="286" width="120" height="28" rx="4" fill="#f43f5e" fill-opacity="0.3" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="58" y="304" fill="#fca5a5" font-size="12" font-weight="800" font-family="system-ui">STOP LOSS (-1R)</text>
  <text x="640" y="275" fill="#fda4af" font-size="13" font-weight="800" font-family="system-ui">-1.0x Risk ($100)</text>

  <!-- Take Profit 1 Line -->
  <line x1="120" y1="165" x2="720" y2="165" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="640" y="170" fill="#a7f3d0" font-size="12" font-weight="700" font-family="system-ui">+1.5R ($150) TP 1</text>

  <!-- Take Profit 2 Line (Full Target: 3R) -->
  <line x1="120" y1="90" x2="720" y2="90" stroke="#10b981" stroke-width="3"/>
  <rect x="50" y="76" width="120" height="28" rx="4" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="1.2"/>
  <text x="58" y="94" fill="#6ee7b7" font-size="12" font-weight="800" font-family="system-ui">TARGET (+3R)</text>
  <text x="640" y="95" fill="#34d399" font-size="14" font-weight="900" font-family="system-ui">+3.0x Profit ($300)</text>

  <!-- Middle Callout Box -->
  <rect x="250" y="130" width="300" height="50" rx="8" fill="#020617" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
  <text x="270" y="152" fill="#f8fafc" font-size="12" font-weight="700" font-family="system-ui">Math: 33% Win Rate = Profitable</text>
  <text x="270" y="169" fill="#94a3b8" font-size="11" font-family="system-ui">Lose 6 trades (-$600) + Win 3 trades (+$900) = +$300 Green!</text>

  <!-- Bottom Tip -->
  <rect x="36" y="360" width="728" height="36" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1"/>
  <text x="50" y="383" fill="#cbd5e1" font-size="12" font-weight="600" font-family="system-ui">💡 Rule: Never risk $1 to make $1. Minimum viable institutional trade reward is 1:2 to 1:3 R:R.</text>
</svg>

